<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EbookAI - Smart Ebook Creation Assistant</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        .editor-content {
            min-height: 500px;
            outline: none;
        }
        .selected-text {
            background-color: #e6f3ff;
        }
        @media (max-width: 768px) {
            .workspace {
                flex-direction: column;
            }
            .sidebar, .main-content {
                width: 100% !important;
            }
        }
    </style>
</head>
<body class="bg-gray-50">
    <main class="min-h-screen flex flex-col">
        <!-- Header -->
        <header class="bg-gradient-to-r from-blue-600 to-blue-700 text-white p-4 shadow-lg">
            <div class="container mx-auto flex justify-between items-center">
                <h1 class="text-2xl font-bold flex items-center gap-2">
                    <i class="bi bi-book"></i> EbookAI
                </h1>
                <div class="flex gap-3">
                    <button id="saveBtn" class="bg-blue-500 text-white px-4 py-2 rounded-lg hover:bg-blue-600">
                        <i class="bi bi-save"></i> Save
                    </button>
                    <button id="exportPDF" class="bg-white text-blue-600 px-4 py-2 rounded-lg hover:bg-blue-50">
                        <i class="bi bi-file-earmark-pdf"></i> Export PDF
                    </button>
                </div>
            </div>
        </header>

        <!-- Workspace -->
        <div class="container mx-auto p-4 flex-grow">
            <div class="workspace flex gap-4 h-full">
                <!-- Sidebar -->
                <div class="sidebar w-1/4 flex flex-col gap-4">
                    <!-- AI Input -->
                    <div class="bg-white rounded-lg shadow p-4">
                        <textarea id="aiPrompt" class="w-full p-3 border rounded-lg resize-none" rows="4" 
                            placeholder="Describe your ebook idea or ask AI to help with specific content..."></textarea>
                        <button id="generateContent" class="mt-2 w-full bg-blue-600 text-white px-6 py-2 rounded-lg hover:bg-blue-700">
                            <i class="bi bi-magic"></i> Generate Content
                        </button>
                    </div>

                    <!-- Chapters -->
                    <div class="bg-white rounded-lg shadow p-4 flex-grow">
                        <div class="flex justify-between items-center mb-4">
                            <h2 class="font-bold">Chapters</h2>
                            <button id="addChapter" class="text-blue-600 hover:text-blue-700">
                                <i class="bi bi-plus-circle"></i>
                            </button>
                        </div>
                        <div id="chapterTabs" class="space-y-2">
                            <!-- Chapters will be populated here -->
                        </div>
                    </div>
                </div>

                <!-- Main Content -->
                <div class="main-content w-3/4 bg-white rounded-lg shadow p-6">
                    <div class="flex justify-between items-center mb-4">
                        <input id="chapterTitle" class="text-xl font-bold bg-transparent border-b border-transparent hover:border-gray-300 focus:border-blue-500 focus:outline-none" value="Chapter Title">
                        <div class="flex gap-2">
                            <button id="formatBold" class="p-2 hover:bg-gray-100 rounded">
                                <i class="bi bi-type-bold"></i>
                            </button>
                            <button id="formatItalic" class="p-2 hover:bg-gray-100 rounded">
                                <i class="bi bi-type-italic"></i>
                            </button>
                            <button id="formatUnderline" class="p-2 hover:bg-gray-100 rounded">
                                <i class="bi bi-type-underline"></i>
                            </button>
                        </div>
                    </div>
                    <div id="editor" class="editor-content prose max-w-none" contenteditable="true">
                        <p>Start writing your content here or generate content using AI...</p>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script>
        let chapters = [];
        let currentChapter = null;

        // Initialize formatting buttons
        document.getElementById('formatBold').onclick = () => document.execCommand('bold', false, null);
        document.getElementById('formatItalic').onclick = () => document.execCommand('italic', false, null);
        document.getElementById('formatUnderline').onclick = () => document.execCommand('underline', false, null);

        // Create a new chapter
        function createChapter(title = 'New Chapter', content = '') {
            const chapter = {
                id: Date.now(),
                title,
                content
            };
            chapters.push(chapter);
            updateChapterTabs();
            switchToChapter(chapter);
            return chapter;
        }

        // Update chapter tabs in sidebar
        function updateChapterTabs() {
            const chapterTabs = document.getElementById('chapterTabs');
            chapterTabs.innerHTML = chapters.map(chapter => `
                <div class="chapter-tab ${currentChapter?.id === chapter.id ? 'bg-blue-50' : ''} p-3 rounded-lg cursor-pointer hover:bg-gray-50"
                     data-id="${chapter.id}">
                    <div class="flex justify-between items-center">
                        <span class="truncate">${chapter.title}</span>
                        <i class="bi bi-trash text-red-500 hover:text-red-700 delete-chapter"></i>
                    </div>
                </div>
            `).join('');

            // Add click handlers
            document.querySelectorAll('.chapter-tab').forEach(tab => {
                tab.onclick = (e) => {
                    if (!e.target.classList.contains('delete-chapter')) {
                        const chapterId = parseInt(tab.dataset.id);
                        switchToChapter(chapters.find(c => c.id === chapterId));
                    }
                };
            });

            document.querySelectorAll('.delete-chapter').forEach(btn => {
                btn.onclick = (e) => {
                    e.stopPropagation();
                    const chapterId = parseInt(e.target.closest('.chapter-tab').dataset.id);
                    deleteChapter(chapterId);
                };
            });
        }

        // Switch to a different chapter
        function switchToChapter(chapter) {
            if (currentChapter) {
                saveCurrentChapter();
            }
            currentChapter = chapter;
            document.getElementById('chapterTitle').value = chapter.title;
            document.getElementById('editor').innerHTML = chapter.content;
            updateChapterTabs();
        }

        // Save current chapter content
        function saveCurrentChapter() {
            if (currentChapter) {
                currentChapter.title = document.getElementById('chapterTitle').value;
                currentChapter.content = document.getElementById('editor').innerHTML;
            }
        }

        // Delete a chapter
        function deleteChapter(chapterId) {
            if (chapters.length <= 1) {
                alert('Cannot delete the last chapter');
                return;
            }
            chapters = chapters.filter(c => c.id !== chapterId);
            if (currentChapter?.id === chapterId) {
                switchToChapter(chapters[0]);
            }
            updateChapterTabs();
        }

        // Event Listeners
        document.getElementById('addChapter').onclick = () => createChapter();
        
        document.getElementById('generateContent').onclick = () => {
            const prompt = document.getElementById('aiPrompt').value.trim();
            if (!prompt) return;

            // Simulate AI response
            const generatedContent = `<p>Generated content based on: ${prompt}</p>`;
            
            // If text is selected, replace only that part
            const selection = window.getSelection();
            if (selection.toString()) {
                document.execCommand('insertHTML', false, generatedContent);
            } else {
                // Create new chapter with generated content
                createChapter(`Chapter: ${prompt.substring(0, 20)}...`, generatedContent);
            }
            
            document.getElementById('aiPrompt').value = '';
        };

        document.getElementById('saveBtn').onclick = () => {
            saveCurrentChapter();
            alert('Changes saved successfully!');
        };

        document.getElementById('exportPDF').onclick = () => {
            saveCurrentChapter();
            alert('PDF export would be implemented here with all chapters content');
        };

        // Initialize with first chapter
        createChapter('Introduction');

        // Handle chapter title changes
        document.getElementById('chapterTitle').onchange = () => {
            saveCurrentChapter();
            updateChapterTabs();
        };

        // Add selection highlight functionality
        document.getElementById('editor').onmouseup = () => {
            const selection = window.getSelection();
            if (selection.toString()) {
                document.execCommand('backColor', false, '#e6f3ff');
            }
        };
    </script>
<script>document.body.addEventListener('wheel', e => { if (!e.ctrlKey) return; e.preventDefault(); return }, { passive: false })</script>
	</body>
</html>
